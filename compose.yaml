x-common: &common
  build: .
  restart: unless-stopped
  network_mode: host
  environment: &env
    STATUS_FILE: /host/run/openvpn-server/status-server.log

services:
  vpn-status:
    <<: *common
    command: ["python3", "/app/vpn_status.py"]
    pid: host
    privileged: true            # nsenter to restart OpenVPN on the host
    environment:
      <<: *env
      IN_CONTAINER: "1"
    volumes:
      - ./config.json:/app/config.json:ro
      - /run:/host/run:ro
      - /etc/openvpn:/etc/openvpn
      - /usr/share/easy-rsa:/usr/share/easy-rsa:ro
      - /root/router-bundles:/root/router-bundles

  tl-status:
    <<: *common
    command: ["python3", "/app/tl_status.py"]
    cap_add: [NET_RAW, NET_ADMIN]   # read packets on tun0
    volumes:
      - ./config.json:/app/config.json:ro
      - /run:/host/run:ro
